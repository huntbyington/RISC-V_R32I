[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=/opt/sail-riscv/riscof-plugins/sail_cSim
DUTPlugin=riscv_top
DUTPluginPath=/work/dut

[riscv_top]
pluginpath=/work/dut
ispec=/work/dut/riscv_top_isa.yaml
pspec=/work/dut/riscv_top_platform.yaml
target_run=1
jobs=1
CC=riscv32-unknown-elf-gcc
OBJCOPY=riscv32-unknown-elf-objcopy
IVERILOG=iverilog
VVP=vvp

[sail_cSim]
pluginpath=/opt/sail-riscv/riscof-plugins/sail_cSim
