[RISCOF]
ReferencePlugin=spike_simple
ReferencePluginPath=/work/ref
DUTPlugin=riscv_top
DUTPluginPath=/work/dut

[riscv_top]
pluginpath=/work/dut
ispec=/work/dut/riscv_top_isa.yaml
pspec=/work/dut/riscv_top_platform.yaml
target_run=1
jobs=1
CC=riscv32-unknown-elf-gcc
OBJCOPY=riscv32-unknown-elf-objcopy
IVERILOG=iverilog
VVP=vvp

[spike_simple]
pluginpath=/work/ref
ispec=/work/ref/spike_simple_isa.yaml
pspec=/work/ref/spike_simple_platform.yaml
