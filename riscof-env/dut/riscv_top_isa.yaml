hart_ids: [0]
hart0:
  ISA: RV32I
  physical_addr_sz: 32
  User_Spec_Version: '2.3'
  supported_xlen: [32]

  # No privileged extensions/CSRs are implemented -- machine mode "exists"
  # only in the trivial sense that there is nothing else. Traps, CSR access,
  # and exceptions are not implemented in the DUT. M/Zicsr/Zifencei are
  # deliberately absent from ISA above, so their per-extension config blocks
  # aren't valid schema fields here (riscv-config only allows config for
  # extensions actually listed in the ISA string).
  hw_data_misaligned_support: false
