hart_ids: [0]
hart0:
  ISA: RV32I
  physical_addr_sz: 32
  User_Spec_Version: '2.3'
  supported_xlen: [32]

  # No privileged extensions/CSRs are implemented -- machine mode "exists"
  # only in the trivial sense that there is nothing else. Traps, CSR access,
  # and exceptions are not implemented in the DUT.
  M:
    version: '2.0'
    accept: true
  Zicsr:
    version: '2.0'
    accept: false
  Zifencei:
    version: '2.0'
    accept: false

  hw_data_misaligned_support: false
